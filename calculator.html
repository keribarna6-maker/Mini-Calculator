
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #090909;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 360px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand small {
      color: #858585;
      letter-spacing: 5px;
      font-size: 10px;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 500;
      letter-spacing: 1px;
      margin: 10px 0 0;
    }

    .calculator {
      padding: 22px;
      border: 1px solid #292929;
      border-radius: 26px;
      background: linear-gradient(145deg, #191919, #101010);
      box-shadow: 0 25px 80px #000;
    }

    .display {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      padding: 12px 4px 24px;
    }

    #expression {
      min-height: 22px;
      color: #929292;
      font-size: 15px;
      overflow-wrap: anywhere;
      text-align: right;
    }

    #result {
      max-width: 100%;
      font-size: clamp(36px, 10vw, 48px);
      font-weight: 300;
      letter-spacing: -2px;
      overflow-wrap: anywhere;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 62px;
      border: 1px solid #333;
      border-radius: 17px;
      background: #242424;
      color: #fff;
      font-size: 21px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: #383838;
    }

    button:active {
      transform: scale(0.96);
    }

    button.utility {
      background: #dedede;
      color: #111;
      border-color: #dedede;
    }

    button.operator {
      background: #fff;
      color: #111;
      border-color: #fff;
      font-size: 25px;
    }

    button.zero {
      grid-column: span 2;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #626262;
      font-size: 10px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <small>THE D TECHNOLOGIES</small>
      <h1>Mini Calculator</h1>
    </header>

    <section class="calculator" aria-label="Számológép">
      <div class="display" aria-live="polite">
        <div id="expression"></div>
        <div id="result">0</div>
      </div>

      <div class="keys">
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="sign">+/−</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-op="÷">÷</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button class="operator" data-op="×">×</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button class="operator" data-op="−">−</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button class="operator" data-op="+">+</button>

        <button class="utility" data-action="backspace">⌫</button>
        <button class="zero" data-digit="0">0</button>
        <button data-action="decimal">.</button>
        <button class="operator" data-action="equals">=</button>
      </div>
    </section>

    <footer class="footer">SIMPLE · CLEAN · PRECISE</footer>
  </main>

  <script>
    const resultEl = document.getElementById("result");
    const expressionEl = document.getElementById("expression");

    let current = "0";
    let stored = null;
    let operator = null;
    let waitingForNumber = false;
    let justCalculated = false;

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "Error";
      if (Object.is(value, -0)) value = 0;
      return String(Number(value.toPrecision(12)));
    }

    function render() {
      resultEl.textContent = current;
    }

    function clearAll() {
      current = "0";
      stored = null;
      operator = null;
      waitingForNumber = false;
      justCalculated = false;
      expressionEl.textContent = "";
      render();
    }

    function inputDigit(digit) {
      if (current === "Error" || waitingForNumber || justCalculated) {
        current = digit;
        waitingForNumber = false;
        justCalculated = false;
        if (!operator) expressionEl.textContent = "";
      } else if (current.length < 15) {
        current = current === "0" ? digit : current + digit;
      }
      render();
    }

    function calculate(a, b, op) {
      switch (op) {
        case "+": return a + b;
        case "−": return a - b;
        case "×": return a * b;
        case "÷": return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function chooseOperator(nextOperator) {
      if (current === "Error") return;

      const value = Number(current);

      if (operator && !waitingForNumber) {
        const answer = calculate(stored, value, operator);
        current = formatNumber(answer);
        stored = answer;
        render();
      } else {
        stored = value;
      }

      if (!Number.isFinite(stored)) {
        current = "Error";
        stored = null;
        operator = null;
        render();
        return;
      }

      operator = nextOperator;
      waitingForNumber = true;
      justCalculated = false;
      expressionEl.textContent = `${current} ${operator}`;
    }

    function equals() {
      if (!operator || stored === null || current === "Error") return;

      const a = stored;
      const b = Number(current);
      const op = operator;
      const answer = calculate(a, b, op);

      expressionEl.textContent = `${formatNumber(a)} ${op} ${formatNumber(b)} =`;
      current = formatNumber(answer);
      stored = null;
      operator = null;
      waitingForNumber = true;
      justCalculated = true;
      render();
    }

    function handleAction(action) {
      if (action === "clear") {
        clearAll();
      } else if (action === "equals") {
        equals();
      } else if (action === "decimal") {
        if (current === "Error" || waitingForNumber || justCalculated) {
          current = "0.";
          waitingForNumber = false;
          justCalculated = false;
        } else if (!current.includes(".")) {
          current += ".";
        }
        render();
      } else if (action === "sign") {
        if (current !== "Error" && Number(current) !== 0) {
          current = formatNumber(-Number(current));
          render();
        }
      } else if (action === "percent") {
        if (current !== "Error") {
          current = formatNumber(Number(current) / 100);
          render();
        }
      } else if (action === "backspace") {
        if (current !== "Error" && !waitingForNumber && !justCalculated) {
          current = current.length > 1 ? current.slice(0, -1) : "0";
          if (current === "-") current = "0";
          render();
        }
      }
    }

    document.querySelector(".keys").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.digit !== undefined) {
        inputDigit(button.dataset.digit);
      } else if (button.dataset.op) {
        chooseOperator(button.dataset.op);
      } else if (button.dataset.action) {
        handleAction(button.dataset.action);
      }
    });

    document.addEventListener("keydown", event => {
      if (/^[0-9]$/.test(event.key)) inputDigit(event.key);
      else if (event.key === ".") handleAction("decimal");
      else if (event.key === "Enter" || event.key === "=") equals();
      else if (event.key === "Backspace") handleAction("backspace");
      else if (event.key === "Escape") clearAll();
      else if (event.key === "+") chooseOperator("+");
      else if (event.key === "-") chooseOperator("−");
      else if (event.key === "*") chooseOperator("×");
      else if (event.key === "/") {
        event.preventDefault();
        chooseOperator("÷");
      }
    });
  </script>
</body>
</html>
